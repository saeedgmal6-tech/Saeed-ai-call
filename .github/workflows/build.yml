name: SAEED AI On-Device Android Build
# Rebuild after Kotlin UI compile fixes

on:
  push:
    branches: [ saeed-ai-rebuild ]
  pull_request:
    branches: [ saeed-ai-rebuild ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SAEED AI
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK, NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Fetch official llama.cpp Android inference engine
        run: |
          mkdir -p third_party
          git clone --depth 1 --recurse-submodules https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          cat > third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.arm.aichat"
              compileSdk = 36
              ndkVersion = "29.0.13113456"

              defaultConfig {
                  minSdk = 33
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
                  externalNativeBuild {
                      cmake {
                          arguments += "-DCMAKE_BUILD_TYPE=Release"
                          arguments += "-DBUILD_SHARED_LIBS=ON"
                          arguments += "-DLLAMA_BUILD_APP=OFF"
                          arguments += "-DLLAMA_BUILD_COMMON=ON"
                          arguments += "-DLLAMA_OPENSSL=OFF"
                          arguments += "-DGGML_NATIVE=OFF"
                          arguments += "-DGGML_BACKEND_DL=OFF"
                          arguments += "-DGGML_CPU_ALL_VARIANTS=OFF"
                          arguments += "-DGGML_LLAMAFILE=OFF"
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path("src/main/cpp/CMakeLists.txt")
                      version = "3.31.6"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlin {
                  jvmToolchain(17)
                  compileOptions {
                      targetCompatibility = JavaVersion.VERSION_17
                  }
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.datastore:datastore-preferences:1.2.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

      - name: Build on-device inference APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAEED-AI-ONDEVICE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

